[package]
name = "t3wow"
version = "0.3.0"
edition = "2021"
description = "T3 WoW companion: brings T3 Code into World of Warcraft: Forever"
license = "MIT"
publish = false

[[bin]]
name = "t3wow"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
tray-icon = "0.19"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
