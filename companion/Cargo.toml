[package]
name = "t3wow"
version = "0.10.0"
edition = "2021"
# tray-icon and muda need 1.90 (std's File::lock, used for the config and update locks, 1.89).
rust-version = "1.90"
description = "T3 WoW companion: brings T3 Code into World of Warcraft: Forever"
license = "MIT"
publish = false

[[bin]]
name = "t3wow"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
getrandom = "0.4"
# Inflates long commands from the game, with a cap on the size (already built for png).
miniz_oxide = "0.9"
png = "0.18"
regex = "1"
# Ed25519 to check release signatures (already built for ureq's TLS).
ring = { version = "0.17", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
tray-icon = "0.26"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The login-keychain item holding the key that encrypts saved sign-ins (src/keychain.rs).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3", default-features = false }
# libproc, to find the running client (src/capture.rs).
libc = "0.2"
# One ScreenCaptureKit stream on the game's window (src/capture/stream.rs): generated
# bindings, no Swift build step. Exact versions; build.rs links the framework weakly.
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
