[package]
name = "t3wow"
version = "0.4.1"
edition = "2021"
# tray-icon and muda need 1.90 (std's File::lock, used for the config and update locks, 1.89).
rust-version = "1.90"
description = "T3 WoW companion: brings T3 Code into World of Warcraft: Forever"
license = "MIT"
publish = false

[[bin]]
name = "t3wow"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
getrandom = "0.4"
regex = "1"
# Ed25519 to check release signatures (already built for ureq's TLS).
ring = { version = "0.17", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
tray-icon = "0.26"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
