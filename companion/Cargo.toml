[package]
name = "t3wow"
version = "0.12.1"
edition = "2021"
# tray-icon and muda need 1.90 (std's File::lock, used for the config and update locks, 1.89).
rust-version = "1.90"
description = "T3 WoW companion: brings T3 Code into World of Warcraft: Forever"
license = "MIT"
publish = false

[[bin]]
name = "t3wow"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
getrandom = "0.4"
# Inflates long commands from the game, with a cap on the size (already built for png).
miniz_oxide = "0.9"
png = "0.18"
regex = "1"
# Ed25519 to check release signatures (already built for ureq's TLS).
ring = { version = "0.17", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }

# The tray icon and its menu, and the folder picker: Windows' tray, a Mac's menu bar.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = "0.18"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# CFData, CFDictionary and friends (src/capture.rs, src/capture/stream.rs, src/wow.rs).
core-foundation = "0.10"
# libproc, to find the running client (src/capture.rs).
libc = "0.2"
# One ScreenCaptureKit stream on the game's window (src/capture/stream.rs): generated
# bindings, no Swift build step. Exact versions; build.rs links the framework weakly.
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "=0.6.5"
# The menu bar app (src/tray/macos.rs): its run loop, timer and alerts; and images pasted in
# the game (src/clip.rs): the pasteboard, and its TIFFs made PNGs.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSAlert",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSText",
  "NSTextField",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSRunLoop", "NSString", "NSThread", "NSTimer"] }
# The app's own notifications (src/tray/macos.rs), once it runs as T3 WoW.app.
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
