# Publishes a release when a version tag is pushed (git tag v0.4.0 && git push origin v0.4.0).
# The source repository is private, so the release goes to the public
# MatiasCiccone/t3wow-releases, which is what the companion's updater reads. It carries
# t3wow.exe and the Mac app (t3wow-macos-arm64.zip), each with its SHA-256 and the SHA-256's
# signature (once signing is set up), and the addon on its own (zipped, for CurseForge or a
# manual install). Three jobs: build-windows (GitHub-hosted), build-macos (the self-hosted Mac
# runner labelled t3wow-mac, so the release waits while that Mac is asleep or offline; it signs
# the app with the project's certificate from the T3WOW_MACOS_CERT_P12 secret), and
# publish, which signs both checksums and uploads everything once both builds are done. Publishing there needs the RELEASES_TOKEN secret: a
# fine-grained token with Contents read and write on t3wow-releases only. Signing needs the
# T3WOW_SIGNING_KEY secret: the release key's private half (PKCS#8 PEM, made by
# scripts/gen-signing-key.mjs), whose public half is in companion/src/updater/release_key.rs. Until both
# are set up, releases go out unsigned with a warning (companions with the placeholder key
# accept that); with only one of the two, the release fails. The addon zip is also uploaded to the
# CurseForge project with the CURSEFORGE_TOKEN secret (a CurseForge API token).
# t3wow.exe gets an Authenticode signature (SSL.com eSigner) once the ESIGNER_* secrets are set;
# without them it goes out unsigned with a warning. See docs/release-signing.md.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_REPO: MatiasCiccone/t3wow-releases
  CURSEFORGE_PROJECT: "1788778"
  # CurseForge's game version type for WoW Forever.
  CURSEFORGE_GAME_TYPE: "88568"

jobs:
  build-windows:
    # GitHub-hosted, unlike CI: the steps need PowerShell 7 (pwsh) and Git's bash, which the
    # self-hosted runners' PC doesn't have.
    runs-on: windows-latest
    env:
      # Authenticode signing (SSL.com eSigner) runs only once its secrets are set; see
      # docs/release-signing.md. 'true' or 'false': secrets can't appear in a step's if.
      AUTHENTICODE: ${{ secrets.ESIGNER_TOTP_SECRET != '' }}
      # The plain version ("0.9.1"); any other build names its commit (companion/build.rs).
      T3WOW_RELEASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Versions match the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path companion/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $addon = (Select-String -Path addon/T3WoW/T3WoW.toc -Pattern '^## Version: (.+)$').Matches[0].Groups[1].Value.Trim()
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $cargo -or $tag -ne $addon -or $tag -ne $npm) { throw "Tag ${tag}, companion ${cargo}, addon ${addon}, package.json ${npm}: bump them together." }

      # Companions with the real key refuse a release without a valid signature, so check the
      # key first (a warning, not a failure, while signing isn't set up at all).
      - name: Release key
        id: key
        env:
          T3WOW_SIGNING_KEY: ${{ secrets.T3WOW_SIGNING_KEY }}
        run: node scripts/sign-release.mjs --check

      # Once a release has gone out signed, an unsigned one means both the key and the secret
      # went missing (say, release_key.rs back to the placeholder and the secret deleted).
      # Companions that require the signature would refuse it, so stop instead.
      - name: Signed releases stay signed
        if: steps.key.outputs.signed != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $latest = gh release list --repo $env:RELEASES_REPO --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw "Couldn't list the releases on $env:RELEASES_REPO." }
          if (-not $latest) { "No earlier release on $env:RELEASES_REPO."; exit 0 }
          $assets = gh release view $latest --repo $env:RELEASES_REPO --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Couldn't read release $latest on $env:RELEASES_REPO." }
          if ($assets -contains "t3wow.exe.sha256.sig") {
            "::error::$latest went out signed, so this release must be too: put back the release key (companion/src/updater/release_key.rs) and the T3WOW_SIGNING_KEY secret. See docs/release-signing.md."
            exit 1
          }
          "$latest went out unsigned too: this one can."

      - run: npm ci
      - run: npm test

      - run: cargo build --release --manifest-path companion/Cargo.toml

      - name: Stage t3wow.exe
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $built = (Get-Item companion/target/release/t3wow.exe).VersionInfo.ProductVersion
          if ($built -ne $tag) { throw "t3wow.exe says it is ${built}, not ${tag}: was T3WOW_RELEASE set for the build?" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item companion/target/release/t3wow.exe release/

      # Authenticode signs t3wow.exe in place, which changes its bytes, so it comes before the
      # SHA-256 (and the release key's signature of it). Without the ESIGNER_* secrets the exe
      # goes out without it, and Windows SmartScreen shows "unrecognized app" as before.
      - name: Authenticode not set up
        if: env.AUTHENTICODE != 'true'
        run: echo "::warning::No ESIGNER_TOTP_SECRET secret, so t3wow.exe goes out without an Authenticode signature. See docs/release-signing.md."

      - name: Authenticode (SSL.com eSigner)
        if: env.AUTHENTICODE == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\release\t3wow.exe
          override: true
          malware_block: false
          environment_name: PROD

      - name: Check the Authenticode signature
        if: env.AUTHENTICODE == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe isn't in the Windows SDK on this runner." }
          & $signtool.FullName verify /pa /v release/t3wow.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for t3wow.exe." }
          $sig = Get-AuthenticodeSignature release/t3wow.exe
          if ($sig.Status -ne 'Valid') { throw "The Authenticode signature is $($sig.Status)." }
          # Without a timestamp the signature would stop being valid when the certificate expires.
          if (-not $sig.TimeStamperCertificate) { throw "The Authenticode signature has no timestamp." }
          "Signed by $($sig.SignerCertificate.Subject)"

      - name: Package
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/t3wow.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  t3wow.exe" | Out-File -Encoding ascii -NoNewline release/t3wow.exe.sha256
          Compress-Archive -Path addon/T3WoW -DestinationPath "release/T3WoW-${{ github.ref_name }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/
          if-no-files-found: error

  build-macos:
    # The MacBook registered as a self-hosted runner (labels self-hosted, macOS, ARM64,
    # t3wow-mac), building as its user: GitHub-hosted Macs count their minutes ten times.
    runs-on: [self-hosted, t3wow-mac]
    env:
      T3WOW_RELEASE: "1"
      # The project's self-signed certificate (docs/release-signing.md), by its SHA-1. It comes
      # from the T3WOW_MACOS_CERT_P12 secret, through a keychain made for this job; with
      # neither the variable nor the secret, the app is signed ad hoc.
      T3WOW_CODESIGN_IDENTITY: ${{ vars.T3WOW_CODESIGN_IDENTITY || '-' }}
      # 'true' or 'false': secrets can't appear in a step's if.
      MAC_CERT: ${{ secrets.T3WOW_MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - run: npm ci
      - name: Tests (addon Lua and companion, on macOS)
        run: npm test

      # macOS keeps Screen Recording for an update only while the app's designated requirement,
      # which names the certificate, stays the same. One release signed ad hoc after a signed
      # one would cost every Mac user their grant, so a half-configured release fails here.
      - name: Mac signing certificate
        run: |
          if [ "$MAC_CERT" = "true" ] && [ "$T3WOW_CODESIGN_IDENTITY" = "-" ]; then
            echo "::error::The T3WOW_MACOS_CERT_P12 secret is set but the T3WOW_CODESIGN_IDENTITY variable isn't: set it to the certificate's SHA-1 (docs/release-signing.md)."
            exit 1
          fi
          if [ "$MAC_CERT" != "true" ] && [ "$T3WOW_CODESIGN_IDENTITY" != "-" ]; then
            echo "::error::The T3WOW_CODESIGN_IDENTITY variable names a certificate but the T3WOW_MACOS_CERT_P12 secret is missing. Refusing to sign ad hoc: that would cost every Mac user their Screen Recording grant. Restore the secret (docs/release-signing.md)."
            exit 1
          fi
          if [ "$MAC_CERT" != "true" ]; then
            echo "::warning::No Mac signing certificate: T3 WoW.app is signed ad hoc, and macOS asks for Screen Recording again after each update."
          fi

      # A keychain of its own, with a password made here and never shown, so the job doesn't
      # depend on the login keychain being unlocked. The partition list lets codesign use the
      # key without the dialog nobody is there to answer.
      - name: Signing keychain
        if: env.MAC_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.T3WOW_MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.T3WOW_MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/t3wow-signing.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          p12="$RUNNER_TEMP/T3 WoW Self-Signed.p12"
          (umask 077 && printf '%s' "$CERT_P12" | base64 --decode > "$p12")
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          status=0
          security import "$p12" -k "$keychain" -f pkcs12 -P "$CERT_PASSWORD" -T /usr/bin/codesign > /dev/null || status=$?
          rm -f "$p12"
          [ "$status" = 0 ] || { echo "::error::Couldn't import T3WOW_MACOS_CERT_P12: is T3WOW_MACOS_CERT_PASSWORD its password?"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # In front of the user's search list, which the cleanup step puts back.
          keychains=("$keychain")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && [ "$line" != "$keychain" ] && keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          identities=$(security find-identity -p codesigning "$keychain")
          if ! printf '%s' "$identities" | grep -qiF "$T3WOW_CODESIGN_IDENTITY"; then
            echo "::error::T3WOW_MACOS_CERT_P12 holds no signing identity that T3WOW_CODESIGN_IDENTITY names."
            exit 1
          fi
          echo "T3WOW_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build T3 WoW.app
        run: npm run build:app

      - name: The app is this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/T3 WoW.app/Contents/Info.plist")
          if [ "$built" != "$tag" ]; then echo "::error::T3 WoW.app says it is $built, not $tag: was T3WOW_RELEASE set for the build?"; exit 1; fi
          codesign --verify --deep --strict "dist/T3 WoW.app"
          if [ "$T3WOW_CODESIGN_IDENTITY" != "-" ]; then
            requirement=$(codesign -d -r- "dist/T3 WoW.app" 2>&1)
            want=$(printf '%s' "$T3WOW_CODESIGN_IDENTITY" | tr '[:upper:]' '[:lower:]')
            case "$requirement" in
              *"certificate leaf = H\"$want\""*) ;;
              *) echo "::error::T3 WoW.app's designated requirement doesn't name the certificate: $requirement"; exit 1 ;;
            esac
          fi
          mkdir -p release
          cp dist/t3wow-macos-arm64.zip dist/t3wow-macos-arm64.zip.sha256 release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release/
          if-no-files-found: error

      # Even after a failure: the keychain goes, and the user's search list is as it was.
      - name: Remove the signing keychain
        if: always() && env.MAC_CERT == 'true'
        run: |
          keychain="$RUNNER_TEMP/t3wow-signing.keychain-db"
          keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && [ "$line" != "$keychain" ] && keychains+=("$line")
          done < <(security list-keychains -d user)
          [ "${#keychains[@]}" -gt 0 ] && security list-keychains -d user -s "${keychains[@]}"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/T3 WoW Self-Signed.p12"

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release/
          merge-multiple: true

      - name: Sign the checksum
        env:
          T3WOW_SIGNING_KEY: ${{ secrets.T3WOW_SIGNING_KEY }}
        run: |
          node scripts/sign-release.mjs release/t3wow.exe.sha256
          node scripts/sign-release.mjs release/t3wow-macos-arm64.zip.sha256

      # Only feat and fix subjects (without the prefix) go public: the rest (ci, chore,
      # docs, refactor...) is the private repository's business.
      - name: Release notes (feat and fix subjects since the previous tag)
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          changes=$(git log --no-merges --format='%s' "$range" | sed -nE 's/^(feat|fix)(\([^)]*\))?!?: *(.+)$/- \3/p')
          {
            echo "## Changes"
            echo
            echo "${changes:-- Fixes and improvements behind the scenes.}"
            echo
            echo "On Windows, download \`t3wow.exe\` and run it; it installs the addon and updates itself from here."
            echo
            echo "On a Mac with Apple Silicon (alpha), download \`t3wow-macos-arm64.zip\`, unzip it and move T3 WoW.app to Applications. The first time, open it, then allow it in System Settings > Privacy & Security (Open Anyway)."
          } > release/NOTES.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: T3 WoW ${{ github.ref_name }}
          body_path: release/NOTES.md
          files: |
            release/t3wow.exe
            release/t3wow.exe.sha256
            release/t3wow.exe.sha256.sig
            release/t3wow-macos-arm64.zip
            release/t3wow-macos-arm64.zip.sha256
            release/t3wow-macos-arm64.zip.sha256.sig
            release/T3WoW-${{ github.ref_name }}.zip

      # The addon zip goes to CurseForge too, filed under the WoW Forever version whose API
      # version is the .toc's ## Interface. Skipped while the CURSEFORGE_TOKEN secret isn't set.
      - name: Upload the addon to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if (-not $env:CURSEFORGE_TOKEN) { "No CURSEFORGE_TOKEN secret: skipping CurseForge."; exit 0 }
          $headers = @{ "X-Api-Token" = $env:CURSEFORGE_TOKEN }
          $interface = (Select-String -Path addon/T3WoW/T3WoW.toc -Pattern '^## Interface: *(\d+)').Matches[0].Groups[1].Value
          $versions = Invoke-RestMethod -Headers $headers -Uri https://wow.curseforge.com/api/game/versions
          $version = $versions | Where-Object { $_.gameVersionTypeID -eq $env:CURSEFORGE_GAME_TYPE -and $_.apiVersion -eq $interface } | Select-Object -First 1
          if (-not $version) { throw "CurseForge has no WoW Forever version for interface ${interface}." }
          $changes = (Get-Content release/NOTES.md | Where-Object { $_ -notmatch '^On (Windows|a Mac)' }) -join "`n"
          $changelog = "$changes`nThe addon needs the T3 WoW companion (t3wow.exe on Windows, T3 WoW.app on a Mac): https://github.com/$env:RELEASES_REPO/releases/latest"
          $metadata = @{
            changelog = $changelog
            changelogType = "markdown"
            displayName = "T3 WoW ${{ github.ref_name }}"
            gameVersions = @($version.id)
            releaseType = "release"
          } | ConvertTo-Json -Compress
          $uri = "https://wow.curseforge.com/api/projects/$env:CURSEFORGE_PROJECT/upload-file"
          $result = Invoke-RestMethod -Method Post -Headers $headers -Uri $uri -Form @{
            metadata = $metadata
            file = Get-Item "release/T3WoW-${{ github.ref_name }}.zip"
          }
          "Uploaded to CurseForge as file $($result.id), for WoW Forever $($version.name)."
