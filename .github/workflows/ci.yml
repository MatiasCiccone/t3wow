# Tests and builds every pull request on Windows, and tests it on macOS (test-macos, below).
# The built t3wow.exe is attached to the run as an artifact. Not run again on the push to main: a
# PR is merged (rebased) only once this passed on it.
# It runs on the self-hosted Windows runners labelled t3wow (the owner's PC, set up as
# services that run as the owner's account), so it uses that machine's Rust, which CI leaves
# alone: update it there with rustup update. The checkout keeps target/ between runs (each
# runner has its own), so a build recompiles only what changed, and nothing is cached on GitHub.
# test-macos runs the same tests and lint on macOS, on the owner's MacBook registered as a
# self-hosted runner (labels self-hosted, macOS, ARM64, t3wow-mac; the release builds the Mac
# app there too), as its user, with its Homebrew Rust. While that Mac sleeps or is off, a
# PR's macOS check waits in the queue (GitHub drops it after a day). No check is required to
# merge, so it never blocks one. The tests keep to temporary folders (config::config_dir in
# a test build, scratch dirs in $TMPDIR, which macOS empties by itself) and leave the user's
# T3 WoW settings, Keychain and LaunchAgents alone; the tests that need the screen, a live T3
# or GitHub are #[ignore]d. As on Windows, the checkout keeps target/ between runs.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: [self-hosted, t3wow]
    # cmd, not the default: the PC has no PowerShell 7, and Windows PowerShell won't run the
    # step's script under the default execution policy. Each step is a single command.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      - name: Tests (addon Lua and companion)
        run: npm test

      - name: Lint
        run: cargo clippy --manifest-path companion/Cargo.toml --all-targets -- -D warnings

      - name: Build t3wow.exe
        run: cargo build --release --manifest-path companion/Cargo.toml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3wow-exe
          path: companion/target/release/t3wow.exe
          if-no-files-found: error

  test-macos:
    runs-on: [self-hosted, t3wow-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      - name: Tests (addon Lua and companion)
        run: npm test

      - name: Lint
        run: cargo clippy --manifest-path companion/Cargo.toml --all-targets -- -D warnings
